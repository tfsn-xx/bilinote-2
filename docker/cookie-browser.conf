[program:cookie-display]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=5
autorestart=true
stdout_logfile=/var/log/supervisor/cookie-display.log
stderr_logfile=/var/log/supervisor/cookie-display.log

[program:cookie-window-manager]
command=/usr/bin/openbox
environment=DISPLAY=":99"
priority=6
autorestart=true
stdout_logfile=/var/log/supervisor/cookie-window-manager.log
stderr_logfile=/var/log/supervisor/cookie-window-manager.log

[program:cookie-vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900
priority=7
autorestart=true
stdout_logfile=/var/log/supervisor/cookie-vnc.log
stderr_logfile=/var/log/supervisor/cookie-vnc.log

[program:cookie-login]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=8
autorestart=true
stdout_logfile=/var/log/supervisor/cookie-login.log
stderr_logfile=/var/log/supervisor/cookie-login.log
